name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# ★ 同一分支上只跑最新那次推送，旧的直接取消。
#
# 没有这一段的代价是实打实的：本仓库的 CI 从建库起就是红的，而队列里积压了十几个
# 待跑的 run，每次去看都是"queued"，于是**十八轮都没人看到过一次真实结果**——
# 而那期间藏着一个"cmd/ 从未被提交"的致命问题。
# 迟到十九个提交的反馈不叫反馈。
#
# 官方文档提醒过：会发布/部署的工作流不该在默认分支上取消，因为每个提交都得跑完。
# 这里不适用——本工作流只做验证，不推镜像也不发版，取消掉被取代的 run 没有任何副作用。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go vet ./...
      # -race 是这里最重要的一道：会话层有路径读写、探测、重传、重平衡四组
      # goroutine 并发碰同一批流状态，竞态在功能测试里表现为"偶尔卡一下"，查起来极痛苦。
      - run: go test -race -count=1 -timeout 10m ./...
      # ★ 再跑一遍**不带 -race** 的。时序类用例（失败关闭的响应时间差、
      # 空闲间隔的变异系数）在 -race 下会被自己跳过：插桩把密码学运算拖慢的比例
      # 远大于 I/O，测出来的是插桩开销不是产品的性质。少了这一步，
      # 那几条守时序侧信道的断言在 CI 里等于不存在。
      - run: go test -count=1 -timeout 10m ./...
      # 进程内跑完整链路（握手 → 0-RTT → 失败关闭 → 路径迁移 → UDP）。
      - run: go run ./cmd/tide-selftest -mode local
      # ★ 再跑一遍**跨进程**的端到端：真的 tide-server + 真的 tide-selftest 客户端，
      # 走命令行、走横幅里打印的公钥、走两个进程之间的真握手。
      # 上面那些步骤全部在**一个进程里**用内存中的对象，覆盖不到"两个二进制怎么配合"
      # 这一层——第 17–19 轮连着三个问题都藏在那里，而当时整套测试是绿的。
      - run: bash deploy/e2e-smoke.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 只验证镜像能构建。不推送——推送要 registry 凭据，那是部署方的事。
      - run: docker build -t tide:ci .
      - run: docker run --rm tide:ci -keygen | head -2
