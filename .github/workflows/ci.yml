name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# ★ 同一分支上只跑最新那次推送，旧的直接取消。
#
# 没有这一段的代价是实打实的：本仓库的 CI 队列里长期积压着十几个待跑的 run，
# 每次去看都是 "queued"，于是**十八轮都没人看到过一次真实结果**——
# 而那期间藏着一个"cmd/ 从未被提交"的致命问题。迟到十九个提交的反馈不叫反馈。
#
# 官方文档提醒过：会发布/部署的工作流不该在默认分支上取消，因为每个提交都得跑完。
# 这里不适用——本工作流只做验证，不推镜像也不发版。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # ★ 所有验证步骤都在 deploy/verify.sh 里，CI 只是它的一个调用方。
      #
      # 这么做的理由不是"整洁"：本仓库的 GitHub Actions 长期不执行（run 排队数小时
      # 不动，后来干脆不再创建），如果验证步骤只写在这个 yml 里，那它们实际上
      # 从未被跑过。放进脚本，任何人（和任何一台构建机）都能用一条命令跑出
      # **和 CI 完全一样**的结果，两边也不会各自漂移。
      #
      # --here：CI 的检出本身就是提交态，不需要再导出一次。
      - run: bash deploy/verify.sh --here

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 只验证镜像能构建。不推送——推送要 registry 凭据，那是部署方的事。
      - run: docker build -t tide:ci .
      - run: docker run --rm tide:ci -keygen | head -2
